<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open .eml and Outlook .msg email files on your Mac without a mail client. Free on the Mac App Store." />
    <title>Feedback - EML/MSG Viewer</title>
    <link rel="canonical" href="https://emlviewer.noma4i.com/feedback" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EML/MSG Viewer" />
    <meta property="og:title" content="Feedback - EML/MSG Viewer" />
    <meta property="og:description" content="Open .eml and Outlook .msg email files on your Mac without a mail client. Free on the Mac App Store." />
    <meta property="og:url" content="https://emlviewer.noma4i.com/feedback" />
    <meta property="og:image" content="https://emlviewer.noma4i.com/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EML/MSG Viewer displaying an email on a Mac" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Feedback - EML/MSG Viewer" />
    <meta name="twitter:description" content="Open .eml and Outlook .msg email files on your Mac without a mail client. Free on the Mac App Store." />
    <meta name="twitter:image" content="https://emlviewer.noma4i.com/img/og.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="wrap nav">
      <a class="brand" href="/">
        <img src="/img/icon.png" alt="" />
        EML/MSG Viewer
      </a>
      <nav class="navlinks" aria-label="Main navigation">
        <a href="/support">Support</a>
        <a href="/privacy">Privacy</a>
        <a href="/feedback">Feedback</a>
      </nav>
    </header>
    <main class="wrap content">
      <span class="eyebrow">Get in touch</span>
      <h1>Feedback</h1>
      <p>Tell us about your experience or a problem with EML/MSG Viewer.</p>
      <form action="/api/feedback" method="post">
        <label>
          Name (optional)
          <input name="name" autocomplete="name" />
        </label>
        <label>
          Email (optional)
          <input type="email" name="email" autocomplete="email" />
        </label>
        <label>
          App version
          <input name="version" />
        </label>
        <label class="honeypot" aria-hidden="true">
          Website
          <input name="website" tabindex="-1" autocomplete="off" />
        </label>
        <label>
          Message
          <textarea name="message" required></textarea>
        </label>
        <button type="submit">Send feedback</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer class="footer">
      <div class="wrap">
        <small>EML/MSG Viewer for macOS</small>
        <nav class="footerlinks" aria-label="Footer">
          <a href="/support">Support</a>
          <a href="/privacy">Privacy</a>
          <a href="/feedback">Feedback</a>
        </nav>
      </div>
    </footer>
    <script>
      const form = document.querySelector("form");
      const status = document.querySelector("#status");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Sending...";
        try {
          const response = await fetch(form.action, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(form))),
          });
          if (!response.ok) throw new Error("Request failed");
          status.textContent = "Thank you for your feedback.";
          form.reset();
        } catch {
          status.textContent = "Could not send feedback. Please try again.";
        }
      });
    </script>
  </body>
</html>
